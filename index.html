<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Dashboard</title>
    
    <!-- Gridstack CSS -->
    <link href="./node_modules/gridstack/dist/gridstack.min.css" rel="stylesheet"/>
    <!-- FontAwesome -->
    <link href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet"/>
    <!-- Main CSS -->
    <link href="./css/main.css" rel="stylesheet"/>
</head>
<body>
    <!-- Toolbar -->
    <div id="toolbar">
        <div class="toolbar-section">
            <button id="btn-edit-mode" class="toolbar-btn" title="Режим редактирования">
                <i class="fas fa-edit"></i> Редактирование
            </button>
            <button id="btn-add-widget" class="toolbar-btn" title="Добавить виджет">
                <i class="fas fa-plus"></i> Добавить блок
            </button>
        </div>
        
        <div class="toolbar-section">
            <label for="grid-step">Шаг сетки:</label>
            <select id="grid-step">
                <option value="5">5px</option>
                <option value="10" selected>10px</option>
                <option value="20">20px</option>
                <option value="50">50px</option>
            </select>
        </div>
        
        <div class="toolbar-section">
            <button id="btn-save-layout" class="toolbar-btn" title="Сохранить макет">
                <i class="fas fa-save"></i> Сохранить
            </button>
            <button id="btn-load-layout" class="toolbar-btn" title="Загрузить макет">
                <i class="fas fa-folder-open"></i> Загрузить
            </button>
            <input type="file" id="file-input" accept=".json" style="display: none;">
        </div>
        
        <div class="toolbar-section">
            <span id="status-indicator" class="status-indicator status-green" title="Статус системы">
                <i class="fas fa-circle"></i>
            </span>
            <span id="status-text">Онлайн</span>
        </div>
    </div>

    <!-- Dashboard Container (1920x1080) -->
    <div id="dashboard-wrapper">
        <div id="dashboard-container" class="status-border status-green">
            <div class="grid-stack" id="grid-stack"></div>
        </div>
    </div>

    <!-- Modal for adding widget -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2>Добавить виджет</h2>
            <form id="add-widget-form">
                <div class="form-group">
                    <label for="widget-id">ID виджета:</label>
                    <input type="text" id="widget-id" required placeholder="Уникальный идентификатор">
                </div>
                <div class="form-group">
                    <label for="widget-width">Ширина (в ячейках):</label>
                    <input type="number" id="widget-width" min="1" max="24" value="4">
                </div>
                <div class="form-group">
                    <label for="widget-height">Высота (в ячейках):</label>
                    <input type="number" id="widget-height" min="1" max="20" value="3">
                </div>
                <div class="form-group">
                    <label for="widget-type">Тип виджета:</label>
                    <select id="widget-type">
                        <option value="text">Текстовый</option>
                        <option value="chart">График (Chart.js)</option>
                        <option value="image">Изображение</option>
                        <option value="custom">Произвольный HTML</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Добавить</button>
                    <button type="button" id="btn-cancel-modal" class="btn-secondary">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Hidden file input for loading layout -->
    
    <!-- Scripts -->
    <script src="./node_modules/gridstack/dist/gridstack-all.js"></script>
    <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
